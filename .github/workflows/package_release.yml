name: Android Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from build.gradle
        id: version
        run: |
          FILE="app/build.gradle"
          [ -f "app/build.gradle.kts" ] && FILE="app/build.gradle.kts"
          VERSION=$(grep -m1 'versionCode' "$FILE" | grep -oE '[0-9]+')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get commit message
        id: commit
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Set up JDK 17
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.check_tag.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        if: steps.check_tag.outputs.exists == 'false'
        run: chmod +x gradlew

      # ✅ بناء كل الـ flavors
      - name: Build Release APKs (all flavors)
        if: steps.check_tag.outputs.exists == 'false'
        run: ./gradlew assembleAndroid26Release assembleAndroid33Release --stacktrace

      - name: List built APKs
        if: steps.check_tag.outputs.exists == 'false'
        run: find app/build/outputs/apk -name "*.apk"

      # ✅ رفع الـ APKs كـ Artifact
      - name: Upload APKs as Artifact
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: apk-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body: ${{ steps.commit.outputs.message }}
          files: |
            app/build/outputs/apk/**/release/*.apk
